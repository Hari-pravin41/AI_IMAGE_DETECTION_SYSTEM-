[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "1.0.0"
description = "Local digital forensics and AI image authenticity analysis for photographic images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.4",
  "pillow>=10.0",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "flask>=3.0",
  "reportlab>=4.2",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gpu = ["torch==2.7.1+cu128", "torchvision==0.22.1+cu128"]

[project.scripts]
aidetect = "aidetect.cli:main"

[tool.setuptools.packages.find]
include = ["aidetect*"]

[tool.setuptools.package-data]
aidetect = ["data/*.yaml", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
