<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | AI Image Detection System</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 Inter,Segoe UI,system-ui;color:#172033;background:#f4f6fb;padding:20px}
    main{width:min(430px,100%);background:white;border:1px solid #e4e7ef;border-radius:18px;padding:32px;box-shadow:0 20px 50px rgba(30,38,70,.09)}h1{margin:0 0 8px}.intro{color:#707a8f;margin-bottom:24px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #e4e7ef;border-radius:10px;padding:13px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;background:#6758e8;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.message{min-height:22px;color:#b4232c;margin-top:14px}.success{color:#14805e}.back{display:block;text-align:center;margin-top:16px;color:#5144c8;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p class="intro">Use a strong password that you do not use on other websites.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <button type="submit">Update password</button>
      <div class="message" id="message" role="alert"></div>
    </form>
    <a class="back" href="/login">Back to sign in</a>
  </main>
  <script>
    const token={{ token|tojson }};
    document.querySelector('#reset-form').addEventListener('submit',async event=>{
      event.preventDefault();
      const button=event.currentTarget.querySelector('button'), output=document.querySelector('#message');
      button.disabled=true; output.className='message';
      try{
        const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.querySelector('#password').value})});
        const payload=await response.json(); if(!response.ok) throw new Error(payload.error||'Password reset failed.');
        output.classList.add('success'); output.textContent=payload.message+' Redirecting…';
        setTimeout(()=>location.assign('/login'),1400);
      }catch(error){output.textContent=error.message||String(error); button.disabled=false;}
    });
  </script>
</body>
</html>
